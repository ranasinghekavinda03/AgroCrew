services:
  postgres:
    image: postgres:18-alpine
    container_name: agrocrew-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agrocrew
      POSTGRES_USER: agrocrew
      POSTGRES_PASSWORD: agrocrew_dev_password

    ports:
      - "5432:5432"

    volumes:
      - agrocrew_postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U agrocrew -d agrocrew" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agrocrew_postgres_data:
